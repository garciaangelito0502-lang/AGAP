plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace = "ph.agap.wear"
    compileSdk = 36

    defaultConfig {
        // Same applicationId and signing key as the phone app, or the Wear Data Layer
        // will not connect the two (see gradle/signing.gradle).
        applicationId = "ph.agap.app"
        minSdk = 30 // Wear OS 3
        targetSdk = 36
        versionCode = 2
        versionName = "0.7.0"
    }

    buildTypes {
        release {
            minifyEnabled = false
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

apply from: rootProject.file("gradle/signing.gradle")

dependencies {
    implementation project(':shared')
    implementation libs.play.services.wearable
    implementation libs.androidx.wear

    testImplementation libs.junit
}
