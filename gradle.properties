# The build PC has a very small page file: keep Gradle's memory and parallel workers low,
# or builds fail with out-of-memory errors that have nothing to do with the code.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.workers.max=2

android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9 turns on built-in Kotlin by default. AGAP is Java only (contract 1.1), so it is off.
android.builtInKotlin=false
